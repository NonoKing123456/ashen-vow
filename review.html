<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色验收 · 灰烬誓约</title><link rel="stylesheet" href="review.css?v=16"></head>
<body data-ready="false">
 <header><div><strong>角色验收</strong><small>生产模型与动作 · 中性照明 · 开发检查页</small></div><span id="load-status" role="status">正在加载真实角色…</span></header>
 <main>
  <section id="stage" aria-label="角色前后侧三视图"><canvas id="review-canvas" aria-label="真实角色与装备三维检查画面"></canvas><div id="view-labels"><span>正面</span><span>背面</span><span>侧面</span></div><div id="stage-note">三视图共享同一姿态；移动时镜头跟随角色，网格保持世界位置。</div></section>
  <section class="controls" aria-label="验收控制">
   <div class="control-row"><span class="row-label">动作</span><div id="state-buttons" class="buttons"><button id="state-idle" data-state="idle" aria-pressed="true">待机</button><button id="state-walk" data-state="walk">行走</button><button id="state-run" data-state="run">奔跑</button><button id="state-back" data-state="back">倒退</button><button id="state-left" data-state="left">左移</button><button id="state-right" data-state="right">右移</button><button id="state-forwardLeft" data-state="forwardLeft">前左移</button><button id="state-forwardRight" data-state="forwardRight">前右移</button><button id="state-backLeft" data-state="backLeft">后左移</button><button id="state-backRight" data-state="backRight">后右移</button><button id="state-turn" data-state="turn">转向</button><button id="state-combat" data-state="combat">戒备</button><button id="state-guard" data-state="guard">格挡</button><button id="state-light" data-state="light">轻击</button><button id="state-lightB" data-state="lightB">续斩</button><button id="state-finisher" data-state="finisher">终斩</button><button id="state-heavy" data-state="heavy">重击</button><button id="state-critical" data-state="critical">破势斩</button><button id="state-roll" data-state="roll">翻滚</button><button id="state-heal" data-state="heal">恢复</button><button id="state-hit" data-state="hit">受击</button><button id="state-dead" data-state="dead">倒地</button></div></div>
   <div class="control-row"><span class="row-label">视角</span><div id="view-buttons" class="buttons"><button id="view-three" data-view="three" aria-pressed="true">三视图</button><button id="view-front" data-view="front">正面</button><button id="view-back" data-view="back">背面</button><button id="view-left" data-view="left">左侧</button><button id="view-right" data-view="right">右侧</button><button id="view-quarter" data-view="quarter">前侧</button><button id="view-rear-quarter" data-view="rearQuarter">后侧</button></div><label class="compact-label">环境 <select id="review-environment"><option value="free">空地</option><option value="front">正面贴墙</option><option value="left">侧面贴墙</option><option value="corner">墙角</option></select></label><label class="compact-label">角色 <select id="review-role"><option value="player">誓约者</option><option value="sentinel">失誓守卫</option><option value="boss">无冠守望者</option></select></label></div>
   <div class="control-row"><span class="row-label">播放</span><div class="buttons"><button id="review-pause" aria-pressed="false">暂停</button><button id="review-step">前进一帧</button><button id="review-reset">重置姿态</button><button id="review-quarter">¼ 动作</button><button id="review-half">½ 动作</button><button id="review-three-quarter">¾ 动作</button><button id="review-anticipation">蓄势</button><button id="review-contact">接触</button><button id="review-recovery">收势</button><button id="review-end">结束</button></div><label class="compact-label">速度 <select id="review-speed"><option value="1">正常</option><option value="0.5">半速</option><option value="0.25">四分之一速</option></select></label><label class="compact-label"><input id="review-helpers" type="checkbox"> 骨骼与剑刃辅助线</label><label class="compact-label"><input id="review-travel" type="checkbox" checked> 真实位移</label><label class="compact-label">翻滚方向 <select id="review-roll-direction"><option value="forward">向前</option><option value="back">向后</option><option value="left">向左</option><option value="right">向右</option><option value="forwardLeft">前左斜向</option><option value="backRight">后右斜向</option></select></label><label class="compact-label">动作资源 <select id="review-source"><option value="">游戏动作</option></select></label></div>
   <div class="control-row"><button id="review-export">生成整段动作检查图</button><span id="review-export-status" role="status">同一生产角色，六个阶段，前后侧三视图。</span></div>
   <div id="review-stats" role="status" aria-live="off">等待模型…</div><p class="review-warning">这是视觉验收工具。接触点与骨骼数据用于定位问题，不能代替观察握持、步态和动作衔接。</p>
  </section>
 </main>
 <dialog id="review-sheet" style="width:min(96vw,1600px);max-height:94vh;padding:12px;border:1px solid #87939b;background:#edf1f3"><button id="review-sheet-close">关闭检查图</button> <a id="review-sheet-download" download>下载原图</a><img id="review-sheet-image" alt="当前动作六阶段的生产角色三视图" style="display:block;width:100%;height:auto;margin-top:10px"></dialog>
 <script src="vendor/three.min.js?v=16"></script><script src="vendor/GLTFLoader.js?v=16"></script><script src="feel.js?v=16"></script><script src="navigation.js?v=16"></script><script src="locomotion.js?v=16"></script><script src="rig-constraints.js?v=16"></script><script src="motion.js?v=16"></script><script src="characters.js?v=16"></script><script src="review.js?v=16"></script>
</body></html>
